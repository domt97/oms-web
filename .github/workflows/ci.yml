name: CI

# Typecheck, layer rule, unit tests and production build on every PR and push to develop/master.

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Installs exactly what package-lock.json records and fails when it does not match package.json.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check (typecheck, layer rule, tests) and build
        run: npm run build
